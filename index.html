<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta
      name="description"
      content="Calculadora trabalhista CLT e Aprendiz para trabalhadores e profissionais de RH em Teresina, Piauí. Folha mensal, décimo terceiro e rescisão contratual."
    />
    <meta name="theme-color" content="#002893" />
    <title>Calculadora CLT Teresina</title>
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('clt-teresina-tema');
          var tema =
            salvo === 'light' || salvo === 'dark'
              ? salvo
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', tema);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
